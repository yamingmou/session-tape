<text x="454" y="21" fill="#8b95a5" font-size="12" text-anchor="middle">session-tape demo</text>
<text x="22" y="59" fill="#c9d4e3" font-size="13">演示数据：4 条消息（2 问 2 答）</text>
<text x="22" y="79" fill="#8b95a5" font-size="13">目标            产物        落在哪（临时目录）</text>
<text x="22" y="99" fill="#8b95a5" font-size="13">------------------------------------------------------------------------</text>
<text x="22" y="119" fill="#c9d4e3" font-size="13">pi            5 行       …/session.jsonl</text>
<text x="22" y="139" fill="#c9d4e3" font-size="13">codex         5 行       …/sessions/2023/11/14/rollout-2023-11-14T22-13-21-11111111-2222-3333-4444-55555555</text>
<text x="22" y="159" fill="#c9d4e3" font-size="13">workbuddy     4 条       …/projects/var-folders-ss-mc6rmsvs2db3fx0v4l37gcsw0000gn-T-tape-demo-workbuddy-lsb</text>
<text x="22" y="179" fill="#c9d4e3" font-size="13">claude-code   4 条       …/projects/-var-folders-ss-mc6rmsvs2db3fx0v4l37gcsw0000gn-T-tape-demo-claude-code-</text>
<text x="22" y="199" fill="#c9d4e3" font-size="13">hermes        （需库）      跳过：这一家的写入需要一个真实 state.db 当模板</text>
<text x="22" y="219" fill="#c9d4e3" font-size="13">openclaw      5 行       …/agents/main/sessions/44444444-5555-6666-7777-888888888888.jsonl</text>
<text x="22" y="239" fill="#c9d4e3" font-size="13">上面每一份都是**目标产品格式**的完整会话。真实迁移时，把它放进那个产品的家目录，</text>
<text x="22" y="259" fill="#c9d4e3" font-size="13">再让产品自己打开——我们不以自己的断言为准。</text>
