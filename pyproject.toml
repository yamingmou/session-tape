[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "session-tape"
version = "0.1.0"
description = "把一个产品的会话历史搬到另一个产品里继续（只搬文本历史，单向）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# 刻意零第三方运行时依赖：读侧复用 session-fork-core（可选依赖），
# 生成目标是纯标准库拼 JSON；技能若走 zip 分发也不吃亏。
dependencies = []

[project.optional-dependencies]
# 读源产品需要它（六个适配器都在里面）。不装也能用：--from 传一个 JSONL 目录时不需要。
source = ["session-fork-core"]

[project.scripts]
session-tape = "session_tape.cli:main"

[tool.setuptools.packages.find]
include = ["session_tape*"]
